[project]
name = "hindsight-grok-bot"
version = "0.1.0"
description = "Hindsight plugin for Grok Bot and Cursor — manifest, remote MCP config and skills"
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hindsight_grok_bot"]

[dependency-groups]
dev = [
    "pydantic>=2.0",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 120
